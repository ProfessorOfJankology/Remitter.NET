name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Remitter.sln

      - name: Build
        run: dotnet build Remitter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Remitter.sln --configuration Release --no-build
